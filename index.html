<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>newsmth-reader</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232B2B2D'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='system-ui,sans-serif' font-size='15' font-weight='600' fill='%23FCFCFC'%3En%3C/text%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('xsmth_settings_v1');
          var parsed = raw ? JSON.parse(raw) : {};
          var isV2 = parsed && parsed.prefVersion === 2;
          var mode = parsed.theme || 'light';
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'navy'
                : 'light'
              : mode;
          document.documentElement.dataset.theme = resolved;
          var fontSz = isV2 && parsed.fontSize ? parsed.fontSize : 16;
          var pct = isV2 && parsed.widthPct ? Math.max(50, Math.min(100, parsed.widthPct)) : 98;
          var padX = pct >= 99 ? 10 : pct >= 96 ? 14 : 20;
          document.documentElement.style.setProperty('--font-size-body', fontSz + 'px');
          document.documentElement.style.setProperty('--content-width', pct + '%');
          document.documentElement.style.setProperty('--card-pad-x', padX + 'px');
          if (isV2 && parsed.resolvedFontStack) {
            document.documentElement.style.setProperty('--font-reading', parsed.resolvedFontStack);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
